name = "computable-model-theory"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ComputableModelTheory", "ComputableModelTheoryUtil"]
# Lean options, as an array of `[name, value]` pairs: one representation read by both `lake build`
# and the language server (`moreLeanArgs` reaches only the former), and one that can hold an option
# alongside a longer option extending its name, which TOML's nested-key form cannot.
leanOptions = [
  ["pp.unicode.fun", true], # pretty-prints `fun a ↦ b`
  ["relaxedAutoImplicit", false],
  ["weak.linter.mathlibStandardSet", true],
  ["maxSynthPendingDepth", 3],
  # Lean v4.35 porting shims, set project-wide until the affected proofs are repaired individually
  # (Mathlib's own port sets the same options per declaration):
  # * `isDefEq` now respects transparency on implicit arguments, which breaks `rw`/`simp` on
  #   targets that only typecheck after unfolding `PFun` (`α →. β`);
  # * instance-search assignments must preserve types up to `.instances` transparency, which breaks
  #   coercions of embeddings between `Bundled` carriers typed with explicit structures.
  ["backward.isDefEq.respectTransparency", false],
  ["backward.isDefEq.respectTransparency.instanceSearchTypes", false],
]

[[require]]
name = "InfinitaryLogic"
git = "https://github.com/cameronfreer/infinitary-logic"
rev = "9ab398a577e0ec609e635b47c7cb11c5698b51cc"

# Mathlib last so its dependency versions take precedence over transitive ones
# (e.g. batteries / Cli pulled in by LeanArchitect), per Mathlib's lake update guidance.
[[require]]
name = "mathlib"
git = "https://github.com/cameronfreer/mathlib4"
rev = "346a4bd3f95e8591976c91259badc6d2c300f638"

[[lean_lib]]
name = "ComputableModelTheory"

# Test tooling (the axiom-policy assertion command) is kept out of the library's import
# spine; this target ensures its artifacts are still built for the audit modules.
[[lean_lib]]
name = "ComputableModelTheoryUtil"
globs = ["ComputableModelTheory.Util.AssertAxioms"]
